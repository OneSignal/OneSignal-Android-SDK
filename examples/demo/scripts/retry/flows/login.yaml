appId: com.onesignal.example
---
- runFlow:
    file: _scroll-to.yaml
    env:
      TARGET: login_user_button
- tapOn:
    id: login_user_button
- tapOn:
    id: login_user_id_input
- inputText: ${VALUE}
- runFlow:
    when:
      true: ${JWT != ''}
    commands:
      - tapOn:
          id: login_user_jwt_input
      - inputText: ${JWT}
- tapOn:
    id: singleinput_confirm_button
