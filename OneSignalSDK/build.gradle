// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {
        buildVersions = [
                compileSdkVersion: 34,
                targetSdkVersion: 34,
                minSdkVersion: 21
        ]
        androidGradlePluginVersion = '8.8.2'
        detektVersion = '1.21.0'
        googleServicesGradlePluginVersion = '4.3.10'
        huaweiAgconnectVersion = '1.9.1.304'
        huaweiHMSPushVersion = '6.3.0.304'
        huaweiHMSLocationVersion = '4.0.0.300'
        kotlinVersion = '1.9.25'
        dokkaVersion = '1.9.10'
        coroutinesVersion = '1.7.3'
        kotlinxSerializationJsonVersion = '1.6.3'
        kotestVersion = '5.8.0'
        ioMockVersion = '1.13.2'
        // AndroidX Lifecycle and Activity versions
        lifecycleVersion = '2.6.2'
        activityVersion = '1.7.2'
        startupVersion = '1.1.1'
        ktlintVersion = '0.50.0' // Used by Spotless for Kotlin formatting (compatible with Kotlin 1.7.10)
        spotlessVersion = '6.25.0'
        // BCV hooks into 'kotlin-android', so AGP 9's built-in Kotlin stops it registering tasks.
        // See https://github.com/Kotlin/binary-compatibility-validator/issues/312
        binaryCompatibilityValidatorVersion = '0.16.3'
        tdunningJsonForTest = '1.0' // DO NOT upgrade for tests, using an old version so it matches AOSP

        sharedRepos = {
            google()
            mavenCentral()
            gradlePluginPortal()
            // Huawei maven
            maven { url 'https://developer.huawei.com/repo/' }
        }
        sharedDeps = [
                "com.android.tools.build:gradle:$androidGradlePluginVersion",
                "com.google.gms:google-services:$googleServicesGradlePluginVersion",
                "com.huawei.agconnect:agcp:$huaweiAgconnectVersion",
                "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion",
                "org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion",
                "org.jetbrains.dokka:dokka-gradle-plugin:$dokkaVersion",
                "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:$detektVersion",
                "com.diffplug.spotless:spotless-plugin-gradle:$spotlessVersion",
                "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin:0.32.0",
                "org.jetbrains.kotlinx:binary-compatibility-validator:$binaryCompatibilityValidatorVersion"
        ]
    }

    repositories sharedRepos
    dependencies {
        classpath sharedDeps
    }
}

apply plugin: 'org.jetbrains.kotlinx.binary-compatibility-validator'

// Tracks the public API of the published modules as committed `api/*.api` dumps, so a breaking
// change has to show up as a reviewable diff instead of being spotted by eye.
apiValidation {
    // Not published, so they have no customer-facing surface to protect.
    ignoredProjects += ['app', 'testhelpers']
    // :kmp is a git submodule; its API is owned by OneSignal-KMP-SDK.
    ignoredProjects += ['kmp']

    // Public only because Kotlin has no cross-module internal. Subpackages are ignored too.
    ignoredPackages += [
        'com.onesignal.internal',
        'com.onesignal.core.internal',
        // Not all of debug.internal: wrapper SDKs call debug.internal.logging.Logging.
        'com.onesignal.debug.internal.crash',
        'com.onesignal.debug.internal.logging.logger',
        'com.onesignal.inAppMessages.internal',
        'com.onesignal.location.internal',
        'com.onesignal.notifications.internal',
        'com.onesignal.session.internal',
        'com.onesignal.user.internal',
        'com.onesignal.common.consistency',
        'com.onesignal.common.events',
        'com.onesignal.common.exceptions',
        'com.onesignal.common.modeling',
        'com.onesignal.common.modules',
        'com.onesignal.common.services',
        'com.onesignal.common.threading',
    ]
    // Wrapper SDKs call OneSignalWrapper and IHostPermissionPrompt, so the rest of
    // com.onesignal.common is ignored class by class. Nested classes need their own entry.
    ignoredClasses += [
        'com.onesignal.common.AndroidUtils',
        'com.onesignal.common.AndroidUtils$SchemaType',
        'com.onesignal.common.AndroidUtils$SchemaType$Companion',
        'com.onesignal.common.DateUtils',
        'com.onesignal.common.DeviceUtils',
        'com.onesignal.common.IDManager',
        'com.onesignal.common.InputGuardKt',
        'com.onesignal.common.JSONObjectExtensionsKt',
        'com.onesignal.common.JSONUtils',
        'com.onesignal.common.NetworkUtils',
        'com.onesignal.common.NetworkUtils$ResponseStatusType',
        'com.onesignal.common.OneSignalUtils',
        'com.onesignal.common.PIIHasher',
        'com.onesignal.common.RootToolsInternalMethods',
        'com.onesignal.common.TimeUtils',
        'com.onesignal.common.ViewUtils',
    ]
}

allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs 'libs'
        }
        // Huawei maven
        maven { url 'https://developer.huawei.com/repo/' }
    }

    // Force all modules to use the same Kotlin version
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlinVersion"

            // Exclude deprecated jdk7/jdk8 variants
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    if (details.requested.name == 'kotlin-stdlib-jdk7' ||
                        details.requested.name == 'kotlin-stdlib-jdk8') {
                        details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
                    }
                }
            }
        }
    }
}

// Aggregate Detekt tasks at the root so CI can call them once
gradle.projectsEvaluated {
    def moduleDetektTasks = []
    def moduleDetektBaselineTasks = []

    subprojects.each { p ->
        if (p.plugins.hasPlugin('io.gitlab.arturbosch.detekt')) {
            def detektTask = p.tasks.findByName('detekt')
            if (detektTask != null) moduleDetektTasks << detektTask.path
            def detektBaselineTask = p.tasks.findByName('detektBaseline')
            if (detektBaselineTask != null) moduleDetektBaselineTasks << detektBaselineTask.path
        }
    }

    tasks.register('detekt') {
        if (!moduleDetektTasks.isEmpty()) dependsOn moduleDetektTasks
        group = 'verification'
        description = 'Runs Detekt on all modules.'
    }

    tasks.register('detektBaseline') {
        if (!moduleDetektBaselineTasks.isEmpty()) dependsOn moduleDetektBaselineTasks
        group = 'verification'
        description = 'Creates/updates Detekt baselines for all modules.'
    }
}

// Apply JaCoCo configuration from separate file
apply from: 'coverage/jacoco.gradle'
