name: Add issues to project
on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v2
        with:
          # SDK Mobile Project
          project-url: https://github.com/orgs/OneSignal/projects/18
          github-token: ${{ secrets.GH_PUSH_TOKEN }}
