name: Create Release PR

# Note: The "Use workflow from" dropdown selects which version of THIS workflow to run.
# Always select "main" unless you're testing workflow changes from another branch.
# The "base_branch" input below determines where the release PR will be targeted.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the auto-detected version (e.g. 5.1.38 or 5.2.0-beta1). Leave blank to auto-detect from merged PR titles."
        type: string
        required: false
      base_branch:
        description: "Target branch for the PR (e.g. main for regular releases, 5.4-main for 5.4.x releases)"
        type: string
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version || steps.next_version.outputs.version }}
      release_needed: ${{ inputs.version != '' || steps.next_version.outputs.release-needed == 'true' }}
    env:
      BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
    steps:
      - name: ✅ Validate Base Branch
        run: |
          if [[ "$BASE_BRANCH" == "main" ]]; then
            echo "✅ Valid base branch: main"
          elif [[ "$BASE_BRANCH" =~ ^[0-9]+\.[0-9]+-main$ ]]; then
            echo "✅ Valid base branch: $BASE_BRANCH"
          else
            echo "❌ ERROR: Invalid base branch '$BASE_BRANCH'"
            echo ""
            echo "Base branch must be either:"
            echo "  - 'main' (for regular releases)"
            echo "  - 'X.Y-main' (for version-specific releases, e.g., 5.4-main, 5.5-main)"
            echo ""
            echo "Examples:"
            echo "  ✅ main"
            echo "  ✅ 5.4-main"
            echo "  ✅ 5.10-main"
            echo "  ❌ master"
            echo "  ❌ 5.4"
            echo "  ❌ 5.4-develop"
            exit 1
          fi

      - name: Determine next version
        if: inputs.version == ''
        id: next_version
        uses: OneSignal/sdk-shared/.github/actions/determine-next-version@main
        with:
          github-token: ${{ secrets.GH_PUSH_TOKEN || github.token }}
          target-repo: ${{ github.repository }}
          target-branch: ${{ env.BASE_BRANCH }}

      - name: 📋 Display Configuration
        env:
          VERSION: ${{ inputs.version || steps.next_version.outputs.version }}
          RELEASE_NEEDED: ${{ inputs.version != '' || steps.next_version.outputs.release-needed == 'true' }}
        run: |
          echo "============================================"
          if [[ "$RELEASE_NEEDED" != "true" ]]; then
            echo "ℹ️ No releasable PRs merged since the last release. Nothing to do."
          else
            echo "📦 Release Version: $VERSION"
            echo "🎯 Base Branch (PR Target): $BASE_BRANCH"
            echo "🌿 Release Branch (to create): rel/$VERSION"
          fi
          echo "============================================"

  # Step 1: Use reusable workflow to prepare release branch
  prep:
    needs: determine-version
    if: needs.determine-version.outputs.release_needed == 'true'
    uses: OneSignal/sdk-shared/.github/workflows/prep-release.yml@main
    secrets:
      # Pushes made with GITHUB_TOKEN do not trigger workflows (e.g. E2E on rel/**)
      GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
    with:
      version: ${{ needs.determine-version.outputs.version }}
      target_branch: ${{ inputs.base_branch || 'main' }}

  # Step 2: Bump Android-specific version files on the release branch
  bump-version:
    needs: [determine-version, prep]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
      RELEASE_BRANCH: ${{ needs.prep.outputs.release_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.release_branch }}
          token: ${{ secrets.GH_PUSH_TOKEN || github.token }}

      - name: Setup Git User
        uses: OneSignal/sdk-shared/.github/actions/setup-git-user@main

      - name: Update SDK_VERSION in gradle.properties
        run: |
          sed -i "s/^SDK_VERSION=.*/SDK_VERSION=$VERSION/" OneSignalSDK/gradle.properties
          sed -i "s/^SDK_VERSION=.*/SDK_VERSION=$VERSION/" examples/demo/gradle.properties

      - name: Commit and Push changes
        run: |
          git commit -am "chore: bump SDK_VERSION to $VERSION"
          git push origin "$RELEASE_BRANCH"

  # Step 3: Use reusable workflow to create release PR with release notes
  create-pr:
    needs: [prep, bump-version]
    uses: OneSignal/sdk-shared/.github/workflows/create-release.yml@main
    secrets:
      GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
    with:
      release_branch: ${{ needs.prep.outputs.release_branch }}
      target_branch: ${{ inputs.base_branch || 'main' }}
